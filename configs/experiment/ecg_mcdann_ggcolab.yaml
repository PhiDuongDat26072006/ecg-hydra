# @package _global_

# to execute this experiment run:
# python src/train.py experiment=ecg_mcdann

defaults:
  - override /data: ecg
  - override /model: ecg
  - override /callbacks: default
  - override /logger: csv 
  - override /trainer: gpu 
  - override /paths: default
  - override /extras: default
  - override /hydra: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["ecg", "mcdann"]

trainer:
  min_epochs: 1
  max_epochs: 15
  accelerator: gpu
  devices: 1
  deterministic: warn

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: "/content/drive/MyDrive/Colab_Notebooks/data"
  log_dir: "/content/drive/MyDrive/Colab_Notebooks/ecg_logs"
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}


callbacks:
  model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints
    filename: "ecg-{epoch:02d}-{val_acc:.4f}"
    monitor: "val_acc"
    mode: "max"
    save_top_k: 1
    save_last: true
    auto_insert_metric_name: false

  early_stopping:
    monitor: "val_acc"
    patience: 100
    mode: "max"

  swa:
    _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
    swa_lrs: 0.001