_target_: src.models.ecg_module.ECGLitModule
num_classes: 2
learning_rate: 0.001
compile: false

net:
  _target_: src.models.components.mcdann_net.MCDANNNet
  channels:
    _target_: torch.nn.ModuleList
    modules:
      - &DACB
        _target_: src.models.components.mcdann_net.DACB
        conv1_3:
          _target_: torch.nn.Conv1d
          in_channels: 1
          out_channels: 4
          kernel_size: 3
          padding: 1

        conv1_5:
          _target_: torch.nn.Conv1d
          in_channels: 1
          out_channels: 4
          kernel_size: 5
          padding: 2

        conv1_7:
          _target_: torch.nn.Conv1d
          in_channels: 1
          out_channels: 4
          kernel_size: 7
          padding: 3

        conv1_9:
          _target_: torch.nn.Conv1d
          in_channels: 1
          out_channels: 4
          kernel_size: 9
          padding: 4

        initial_bn:
          _target_: torch.nn.BatchNorm1d
          num_features: 16

        initial_lrelu:
          _target_: torch.nn.LeakyReLU
          negative_slope: 0.01

        dense1:
          _target_: src.models.components.mcdann_net.DenseBlock
          lrelu:
            _target_: torch.nn.LeakyReLU
            negative_slope: 0.01

          bn1:
            _target_: torch.nn.BatchNorm1d
            num_features: 16

          conv1:
            _target_: torch.nn.Conv1d
            in_channels: 16
            out_channels: 8
            kernel_size: 5
            padding: "same"
            bias: false

          dropout1:
            _target_: torch.nn.Dropout1d
            p: 0.1

          bn2:
            _target_: torch.nn.BatchNorm1d
            num_features: 24 # 16 + 8

          conv2:
            _target_: torch.nn.Conv1d
            in_channels: 24 # 16 + 8
            out_channels: 8
            kernel_size: 3
            padding: "same"
            bias: false

          dropout2:
            _target_: torch.nn.Dropout1d
            p: 0.1

        transition1:
          _target_: src.models.components.mcdann_net.TransitionLayer
          conv:
            _target_: torch.nn.Conv1d
            in_channels: 32
            out_channels: 64
            kernel_size: 1
            bias: false

          bn:
            _target_: torch.nn.BatchNorm1d
            num_features: 64

          lrelu:
            _target_: torch.nn.LeakyReLU
            negative_slope: 0.01

          pool:
            _target_: torch.nn.AvgPool1d
            kernel_size: 2
            stride: 2

        se1:
          _target_: src.models.components.mcdann_net.SEBlock
          gap:
            _target_: torch.nn.AdaptiveAvgPool1d
            output_size: 1
          #### reduced_dim = max(reduced_dim:64 // 16, minimum_reduced_dim:4)
          fc1:
            _target_: torch.nn.Linear
            in_features: 64
            out_features: 4 # reduced_dim

          dropout:
            _target_: torch.nn.Dropout1d
            p: 0.1

          fc2:
            _target_: torch.nn.Linear
            in_features: 4
            out_features: 64

          relu:
            _target_: torch.nn.ReLU

          sigmoid:
            _target_: torch.nn.Sigmoid

        dense2:
          _target_: src.models.components.mcdann_net.DenseBlock
          lrelu:
            _target_: torch.nn.LeakyReLU
            negative_slope: 0.01

          bn1:
            _target_: torch.nn.BatchNorm1d
            num_features: 64

          conv1:
            _target_: torch.nn.Conv1d
            in_channels: 64
            out_channels: 8
            kernel_size: 5
            padding: "same"
            bias: false

          dropout1:
            _target_: torch.nn.Dropout1d
            p: 0.1

          bn2:
            _target_: torch.nn.BatchNorm1d
            num_features: 24 # 16 + 8

          conv2:
            _target_: torch.nn.Conv1d
            in_channels: 24 # 16 + 8
            out_channels: 8
            kernel_size: 3
            padding: "same"
            bias: false

          dropout2:
            _target_: torch.nn.Dropout1d
            p: 0.1

        transition2:
          _target_: src.models.components.mcdann_net.TransitionLayer
          conv:
            _target_: torch.nn.Conv1d
            in_channels: 80
            out_channels: 64
            kernel_size: 1
            bias: false

          bn:
            _target_: torch.nn.BatchNorm1d
            num_features: 64

          lrelu:
            _target_: torch.nn.LeakyReLU
            negative_slope: 0.01

          pool:
            _target_: torch.nn.AvgPool1d
            kernel_size: 2
            stride: 2

        se2:
          _target_: src.models.components.mcdann_net.SEBlock
          gap:
            _target_: torch.nn.AdaptiveAvgPool1d
            output_size: 1
          # reduced_dim = max(reduced_dim:64 // 16, minimum_reduced_dim:4)
          fc1:
            _target_: torch.nn.Linear
            in_features: 64
            out_features: 4 # reduced_dim

          dropout:
            _target_: torch.nn.Dropout1d
            p: 0.1

          fc2:
            _target_: torch.nn.Linear
            in_features: 4
            out_features: 64

          relu:
            _target_: torch.nn.ReLU

          sigmoid:
            _target_: torch.nn.Sigmoid

        dense3:
          _target_: src.models.components.mcdann_net.DenseBlock
          lrelu:
            _target_: torch.nn.LeakyReLU
            negative_slope: 0.01

          bn1:
            _target_: torch.nn.BatchNorm1d
            num_features: 64

          conv1:
            _target_: torch.nn.Conv1d
            in_channels: 64
            out_channels: 8
            kernel_size: 5
            padding: "same"
            bias: false

          dropout1:
            _target_: torch.nn.Dropout1d
            p: 0.1

          bn2:
            _target_: torch.nn.BatchNorm1d
            num_features: 24 # 16 + 8

          conv2:
            _target_: torch.nn.Conv1d
            in_channels: 24 # 16 + 8
            out_channels: 8
            kernel_size: 3
            padding: "same"
            bias: false

          dropout2:
            _target_: torch.nn.Dropout1d
            p: 0.1

        final_conv:
          _target_: torch.nn.Conv1d
          in_channels: 80
          out_channels: 64
          kernel_size: 1
          bias: false

        final_bn:
          _target_: torch.nn.BatchNorm1d
          num_features: 64

        skip:
          _target_: torch.nn.Sequential
          _args_:
            - _target_: torch.nn.Conv1d
              in_channels: 16
              out_channels: 64
              kernel_size: 1
              bias: false

            - _target_: torch.nn.BatchNorm1d
              num_features: 64

            - _target_: torch.nn.LeakyReLU
              negative_slope: 0.01

        lrelu:
          _target_: torch.nn.LeakyReLU
          negative_slope: 0.01

        gap:
          _target_: torch.nn.AdaptiveAvgPool1d
          output_size: 1

      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB
      - *DACB

  positional_encoding:
    _target_: src.models.components.mcdann_net.PositionalEncoding
    d_model: 64
    num_leads: 12

  lead_attention:
    _target_: torch.nn.MultiheadAttention
    embed_dim: 64
    num_heads: 1
    dropout: 0.1
    batch_first: true

  classifier: # Linear -> BN -> LR -> Dropout
    _target_: torch.nn.Sequential
    _args_:
      - _target_: torch.nn.Linear
        in_features: 768 # 64 * 12
        out_features: 256

      - _target_: torch.nn.BatchNorm1d
        num_features: 256

      - _target_: torch.nn.LeakyReLU
        negative_slope: 0.01

      - _target_: torch.nn.Dropout
        p: 0.5

      - _target_: torch.nn.Linear
        in_features: 256
        out_features: 128

      - _target_: torch.nn.BatchNorm1d
        num_features: 128

      - _target_: torch.nn.LeakyReLU
        negative_slope: 0.01

      - _target_: torch.nn.Dropout
        p: 0.5

      - _target_: torch.nn.Linear
        in_features: 128
        out_features: 2

  num_classes: 2
